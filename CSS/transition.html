<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <link rel="shortcut icon" href="../HTML/allHtml/ashitosh.jpg" type="image/x-icon">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            width:200px;
            height:200px;
            background-color: aqua;
            border: 2px solid black;
            margin-top: 25px;
            margin-left: 50px;
            text-align: center;
            /* transition: all 0.5s ease-in-out 0.2s; */
            transition: width 1s ease-in-out 0.2s , height 3s ease-in-out 0.2s , background-color 3s, border-radius 5s;
        }

        .box:hover{
            width:90vw;
            height:90vh;
            background-color: crimson;
            border-radius: 50%;
            color:wheat;
        }
    </style>
</head>
<body>
    <div class="box">
        <p><b>Hello World..!</b></p>
    </div>
</body>
</html>
