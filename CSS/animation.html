<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            background-color: mediumaquamarine;
        }

        .box1 {
            background-color: aqua;
            border-radius: 30px;
            border: 2px solid black;
            width: 380px;
            height: 80px;
            margin: 20px;
            text-align: center;
            position: relative;
            animation-name: rightMove;
            animation-duration: 1s;
            animation-timing-function: linear;
            animation-delay: 0.1s;
            animation-iteration-count: 5;
            animation-direction: alternate;
            animation-fill-mode: both;
        }


        @keyframes rightMove {
            from {
                top: 0;
                left: 0;
                background-color: pink;
            }

            to {
                top: 0;
                left: 600px;
                color: white;
                background-color: magenta;
            }
        }

        .box2 {
            background-color: aqua;
            box-sizing: border-box;
            border-radius: 30px;
            border: 2px solid black;
            width: 380px;
            height: 80px;
            margin: 20px;
            text-align: center;
            position: relative;
            animation: leftMove 1s linear 0.1s both 5 alternate;
        }

        @keyframes leftMove {
            from {
                top: 220px;
                left: 600px;
                background-color: chartreuse;
            }

            to {
                top: 220px;
                left: 0;
                background-color: crimson;
            }
        }

        .ball{
            height: 50px;
            width: 50px;
            background-color: red;
            color: white;
            border: 5px solid black;
            border-radius: 50%;
            text-align: center;
            position: relative;
            /* left:100px; */
            animation: ball 10s ease-in-out 1 both;
        }

        @keyframes ball {
            0%{
                top:0px;
                left:150px;
            }
            25% {
                left:800px;
                top:240px;
            }
            50%{
                top:0;
                left: 800px;
            }
            75%{
                left:150px;
                top:240px;
            }
            100%{
                top:0px;
                left:150px;
            }
        }
    </style>
</head>

<body>
    <div class="box1">
        Hello World
        <br>
        This is Ashitosh
    </div>

    <div class="ball">
        
    </div>

    <div class="box2">
        Hello World
        <br>
        This is Ashitosh
    </div>
</body>

</html>
