<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Transform</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            width: 100vw;
            background-color: chocolate;
            overflow: hidden;
        }

        h1{
            font-size: 3em;
            font-family:Arial, sans-serif;
            text-align: center;
            color: white;
            margin-top:2em;
            text-shadow: 10px 10px 10px black;
        }
        
        h1:hover{
            animation: colorful 1s ease infinite;
        }

        @keyframes colorful{
            0%{
                color: rgba(255, 0, 0);
            }
            25%{
                color:rgba(0, 128, 0)
            }
            50%{
                color:rgba(0, 0, 255)
            }
            75%{
                color:rgba(255, 255, 0)
            }
            100%{
                color: rgba(102, 51, 153);
            }
        }

        .container{
            height: 100%;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        
        .item{
            margin: 2em;
            margin-bottom: 10em;
            border: 2px solid white;
            background-color: rgb(67, 51, 20);
            color: white;
            height: 100px;
            width: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }

        .item:hover{
            box-shadow: 0 10px 10px black;
        }

        #rotx:hover{
            transform: rotateX(50deg);
        }

        #roty:hover{
            transform: rotateY(-50deg);
        }

        #rotz:hover{
            transform: rotateZ(56deg);
        }

        #tranx:hover{
            transform: translateX(50px);
        }

        #trany:hover{
            transform: translateY(-50px);
        }

        #tranz:hover{
            transform:perspective(10px) translateZ(-10px);
        }

        #scalx:hover{
            transform:scaleX(10);
        }

        #scaly:hover{
            transform:scaleY(10);
        }

        #scalz:hover{
            transform:perspective(10px) scaleZ(10) rotateY(45deg);
        }

    </style>
</head>
<body>
    <h1>3D Transformation</h1>
    <div class="container">
        <div class="item" id="rotx">RotateX</div>
        <div class="item" id="roty">Rotatey</div>
        <div class="item" id="rotz">Rotatez</div>
        <div class="item" id="tranx">TranslateX</div>
        <div class="item" id="trany">TranslateY</div>
        <div class="item" id="tranz">TranslateZ</div>
        <div class="item" id="scalx">ScaleX</div>
        <div class="item" id="scaly">ScaleX</div>
        <div class="item" id="scalz">ScaleZ</div>
    </div>
</body>
</html>
